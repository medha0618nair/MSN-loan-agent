version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  intake_agent:
    build:
      context: ./agents/intake_agent
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCS_PATH=/app/data/docs
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/uploads:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  kyc_agent:
    build:
      context: ./agents/kyc_agent
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - UPLOAD_PATH=/app/data/uploads
      - CROPS_PATH=/app/data/crops
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/crops:/app/data/crops
    restart: unless-stopped

volumes:
  redis_data:
